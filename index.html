<style>
/* Layout: one-column phone app, bottom tab bar, receipts drawn as paper tickets */
:root{
  --bg:#f3f1ed; --surface:#ffffff; --ink:#2a1a0f; --muted:#6d5e52; --line:#e2dcd3;
  --accent:#e8900c; --accent-ink:#2a1500; --brand:#7a4a1c; --brand-soft:#f8ecd8;
  --ok:#1f7a4d; --warn:#b26b00; --bad:#b3261e; --paper:#fffdf6;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16110c; --surface:#211a13; --ink:#f3ebe1; --muted:#b3a393; --line:#3a2f24;
  --accent:#f2a33a; --accent-ink:#2a1500; --brand:#f0bf73; --brand-soft:#33261a;
  --ok:#5fcf94; --warn:#f0b04a; --bad:#ff8a80; --paper:#1d2430; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110c; --surface:#211a13; --ink:#f3ebe1; --muted:#b3a393; --line:#3a2f24;
  --accent:#f2a33a; --accent-ink:#2a1500; --brand:#f0bf73; --brand-soft:#33261a;
  --ok:#5fcf94; --warn:#f0b04a; --bad:#ff8a80; --paper:#1d2430; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:relative;margin-inline:-16px;margin-bottom:6px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding:14px 16px 18px;border-radius:0 0 26px 26px;overflow:hidden;color:#fff;
  background:#5b3d2b center 38%/cover no-repeat}
header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(28,14,6,.92) 0%,rgba(28,14,6,.55) 38%,rgba(28,14,6,.05) 70%,rgba(28,14,6,.25) 100%);pointer-events:none}
header.top>*{position:relative}
header.top .lang{order:-1;align-self:flex-end;border-color:rgba(255,255,255,.5);background:rgba(28,14,6,.35);backdrop-filter:blur(4px)}
header.top .lang button{color:#fff}
header.top .lang button.on{background:#fff;color:#2a1a0f}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:62px;height:62px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff,0 6px 18px rgba(0,0,0,.4);object-fit:cover}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45);margin:0;line-height:1.1;text-wrap:balance}
.brand p{margin:2px 0 0;color:#f6dcc0;font-size:.92rem;font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .8rem var(--f-body);padding:6px 10px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:8px 0 12px}
h3{font-family:var(--f-display);font-weight:600;font-size:1.02rem;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.stack{display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr 64px 96px 36px;gap:6px;align-items:end}
.item label span{font-size:.75rem}
.btn{font:700 1rem var(--f-body);border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#1fa855;color:#fff}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.x{border:1px solid var(--line);background:transparent;color:var(--bad);border-radius:10px;height:46px;font-size:1.2rem;cursor:pointer}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--brand-soft)}
.cashbox{border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cashbox span{font-weight:700}
.cashbox b{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
.cashbox.give{background:var(--ok);color:#fff}
.cashbox.owe{background:var(--brand-soft);color:var(--bad)}
.cashbox.even{background:var(--brand-soft);color:var(--ok)}
.total-bar b{font-family:var(--f-mono);font-size:1.3rem;color:var(--brand)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 .85rem var(--f-body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.order .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .who{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.order .meta{color:var(--muted);font-size:.85rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid currentColor}
.s-attente{color:var(--warn)} .s-confirmee{color:var(--ink)} .s-prete{color:var(--brand)} .s-livree{color:var(--ok)}
.unpaid{color:var(--bad);font-weight:700}
.ex{font:600 .7rem var(--f-body);color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:1px 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat.main{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.main small{color:var(--bg);opacity:.75}
.stat.main b{font-size:1.7rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
/* receipt ticket */
.ticket{background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:22px 18px 26px;font-family:var(--f-mono);font-size:.86rem;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) 0 0/16px 100% repeat-x;}
.ticket .tphoto{margin:-22px -18px 0;height:130px;background:#5b3d2b center 28%/cover no-repeat}
.ticket .tlogo{width:70px;height:70px;border-radius:50%;display:block;margin:-36px auto 8px;box-shadow:0 0 0 4px var(--paper);position:relative}
.ticket .shop{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-align:center;line-height:1.15}
.ticket .c{text-align:center;color:var(--muted)}
.ticket hr{border:0;border-top:1px dashed var(--muted);margin:12px 0}
.ticket .ln{display:flex;justify-content:space-between;gap:10px}
.ticket .ln span:first-child{min-width:0;overflow-wrap:anywhere}
.ticket .big{font-size:1.1rem;font-weight:700}
.ticket .rno{font-weight:700;letter-spacing:.06em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .full{grid-column:1/-1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 .74rem var(--f-body);padding:6px 2px;display:grid;justify-items:center;gap:3px;cursor:pointer;border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink);background:var(--bg)}
nav.tabs button.new.on{color:var(--accent-ink);background:var(--accent)}
.note{color:var(--muted);font-size:.86rem}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
.prod{display:grid;grid-template-columns:1.3fr 1fr .8fr 44px;grid-template-areas:"n n n x" "b p s x";gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.prod .ps{grid-area:s}.prod .pn{grid-area:n}.prod .pb{grid-area:b}.prod .pp{grid-area:p}.prod .x{grid-area:x;height:auto}
.prod label span{font-size:.72rem}
.scan{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.stk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.stk:last-child{border-bottom:0}
.stk .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.stk .sub{color:var(--muted);font-size:.8rem}
.stk .q{font-family:var(--f-mono);font-size:1.35rem;font-weight:700;text-align:right;flex:none}
.stk .q small{display:block;font:600 .7rem var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stk.low .q{color:var(--warn)} .stk.out .q{color:var(--bad)}
details.edit summary{cursor:pointer;font-weight:700;padding:4px 0}
.scan input{font-family:var(--f-mono);letter-spacing:.05em}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.sync{font:700 .75rem var(--f-body);color:#fff;background:rgba(28,14,6,.45);border-radius:999px;padding:4px 10px;align-self:flex-start}
.sync.err{background:#b3261e}
.toprow{order:-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top .toprow .lang{order:0;align-self:auto}
.login{display:grid;gap:14px;margin-top:10px}
.login input.code{font:700 2rem var(--f-mono);letter-spacing:.35em;text-align:center;padding:14px}
.pvcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.pvcard .l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pvcard .who{font-weight:800;font-family:var(--f-display);font-size:1.1rem;min-width:0;overflow-wrap:anywhere}
.pvcard .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:.8rem;color:var(--muted)}
.pvcard .nums b{display:block;font-family:var(--f-mono);font-size:.95rem;color:var(--ink)}
.pvtag{font:700 .72rem var(--f-body);border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:var(--brand)}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--brand-soft);border-radius:12px;padding:10px 12px}
.codebox b{font:700 1.5rem var(--f-mono);letter-spacing:.2em}
.pvset{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pvset h3{margin:0}
.chips.sub{margin-top:-4px}
.s-web{color:var(--accent)} .s-annulee{color:var(--bad)}
.banner{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:12px 14px;margin:6px 0 10px;font:700 .95rem var(--f-body);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.banner.env{background:var(--brand-soft);color:var(--brand)}
nav.tabs button{position:relative}
.bdg{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:700 .68rem/18px var(--f-body);font-style:normal;padding:0 5px}
.webbox{border-color:var(--accent);border-width:2px}
.ticket.faded{opacity:.75}
.catrow{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow img,.catrow .noimg{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-size:1.4rem}
.catph{display:flex;gap:10px;align-items:center}.catph img{width:72px;height:72px;border-radius:10px;object-fit:cover}
.eitem{display:grid;grid-template-columns:1fr 72px 40px;gap:6px;align-items:end}.eitem label span{font-size:.75rem}
.arow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.arow input{font-size:1.2rem;text-align:center}
.arrive{border-color:var(--brand);border-width:2px}
nav.tabs button span{font-size:.7rem;white-space:nowrap}
.promo{color:#c0262d}.catrow s{color:var(--muted)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}

</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="hero">
    <div class="toprow"><span class="sync" id="sync" hidden></span><div class="lang" role="group" aria-label="Langue"><button id="lfr" type="button">FR</button><button id="lit" type="button">WO</button></div></div>
    <div class="brand"><img class="logo" id="logoImg" alt=""><div><h1 id="hShop"></h1><p id="hAgent"></p></div></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="sheet"></div>

  for(const k in need){const p=findP(k,pv);if(!p)return items.find(i=>i.n.trim().toLowerCase()===k).n+" "+t("notInStock");
    if(p.s<need[k])return t("notEnough")+" "+p.n+" ("+t("left")+" "+p.s+")"}return ""}
function stockTake(o,sign){(o.items||[]).forEach(i=>{const p=findP(i.n,o.pv);if(p){p.s-=sign*i.q;if(sign>0)i.n=p.n}})}

/* ---------- synchronisation ---------- */
let SB=null,pushing=false,syncing=false,pushT=null,syncSt="";
function sb(){if(!SB&&window.supabase&&window.supabase.createClient)SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false}});return SB}
async function rpc(fn,args){if(window.REINE_DEMO)return demoRpc(fn,args);const c=sb();if(!c)throw new Error("NET");const r=await c.rpc(fn,args);if(r.error)throw new Error(r.error.message||"NET");return r.data||{}}
function setSync(st){syncSt=st;const d=document.getElementById("sync");if(!d)return;d.hidden=!SES;d.className="sync "+st;d.textContent=st==="err"?"☁ !":st==="ok"?"☁ ✓":"☁ …";d.title=st==="err"?t("syncErr"):t("syncOk")}
function computeOps(){const ops=[],done=[];
  COLS.forEach(col=>{const m=C[col];for(const id in m){const k=col+"|"+id,js=stable(m[id]);if(SNAP[k]===js)continue;
    const old=SNAP[k]?JSON.parse(SNAP[k]):{},nw=m[id],patch={};
    for(const f in nw)if(nw[f]!==undefined&&stable(nw[f])!==stable(old[f]))patch[f]=nw[f];
    for(const f in old)if(!(f in nw)||nw[f]===undefined)patch[f]=null;
    ops.push({col,id,pv:nw.pv||"",patch});done.push([k,js])}});
  for(const k in SNAP){const p=k.indexOf("|"),col=k.slice(0,p),id=k.slice(p+1);if(!C[col]||!(id in C[col])){ops.push({col,id,del:true});done.push([k,null])}}
  return{ops,done}}
async function push(){if(!SES||pushing)return;const{ops,done}=computeOps();if(!ops.length)return;pushing=true;
  try{for(let i=0;i<ops.length;i+=150){const r=await rpc("reine_put",{p_code:SES.code,p_ops:ops.slice(i,i+150)});if(r.err){if(r.err==="CODE")kicked();throw new Error(r.err)}}
    done.forEach(([k,js])=>{if(js===null)delete SNAP[k];else SNAP[k]=js});writeLocal()}
  finally{pushing=false}}
function applyRow(row){const col=row.col,id=row.id,k=col+"|"+id;if(!C[col])return false;
  const local=C[col][id],ljs=local?stable(local):undefined;
  if(local&&ljs!==SNAP[k])return false;
  if(!local&&SNAP[k]&&!row.deleted)return false;
  if(row.deleted||!row.data){delete SNAP[k];if(local){delete C[col][id];return true}return false}
  const d=row.data;d.id=id;d.pv=row.pv||"";const js=stable(d);
  if(js===ljs){SNAP[k]=js;return false}
  if(!local&&col==="order"&&d.status==="web"&&LAST!==EPOCH)newWeb++;
  C[col][id]=d;SNAP[k]=js;return true}
let newWeb=0;
async function pull(){let changed=false,since=LAST,back=5;
  for(let g=0;g<300;g++){const r=await rpc("reine_pull",{p_code:SES.code,p_since:since,p_back:back});
    if(r.err){if(r.err==="CODE")kicked();throw new Error(r.err)}
    if(r.role&&(r.role!==SES.role||(r.pv||"")!==(SES.pv||""))){SES.role=r.role;SES.pv=r.pv||"";changed=true}
    const rows=r.rows||[];rows.forEach(row=>{if(applyRow(row))changed=true});
    if(rows.length)since=rows[rows.length-1].updated_at;back=0;if(rows.length<1000)break}
  LAST=since;writeLocal();return changed}
async function sync(){if(!SES||syncing)return;syncing=true;let ch=false;
  try{await push();if(!SES)return;ch=await pull();setSync("ok")}catch(e){if(SES)setSync("err")}finally{syncing=false}
  if(newWeb){toast("🛒 "+t("webNew"));newWeb=0;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
  if(ch)softRender()}
function save(){writeLocal();setSync("wait");clearTimeout(pushT);pushT=setTimeout(sync,400)}

function softRender(){const a=document.activeElement;if(!SES)return;
  if(document.getElementById("sheet").innerHTML||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){dirty=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty&&!document.getElementById("sheet").innerHTML){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){dirty=false;render()}}},300));
setInterval(()=>{if(SES&&document.visibilityState==="visible")sync()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});

/* ---------- RECEIPT ---------- */
const oCity=o=>o.city||PV(o.pv).city||"",oAgent=o=>o.agent||PV(o.pv).agent||"";
function receiptText(o){const tot=totalOf(o),c=CFG();
  return [`*${c.shop}*`,`${t("receiptNo")} ${rno(o)}`,`${t("date")}: ${dstr(o.date)}`,`${t("clientL")}: ${o.client}`,"------------------",
   ...o.items.map(i=>`${i.q} x ${i.n} = ${fmt(i.q*i.p)}`),"------------------",
   `*${t("total").toUpperCase()}: ${fmt(tot)}*`,...(o.change?[`${t("givenR")}: ${fmt(o.given)}`,`${t("changeR")}: ${fmt(o.change)}`]:[]),`${t("paid")}: ${fmt(o.paid)}${o.pay?" ("+payTxt(o)+")":""}`,`${t("rest")}: ${fmt(Math.max(0,tot-o.paid))}`,
   `${t("status")}: ${t(o.status)}`,...(o.mode==="liv"?[`${t("liv")}: ${o.addr||""}`]:[]),`${t("agent")}: ${oAgent(o)} (${oCity(o)})`,...(c.tel?[`${t("tel")}: ${c.tel}`]:[]),"",t("thanks")].join("\n");}
function webReplyText(o){const P=PV(o.pv),tot=totalOf(o),c=CFG();
  const num=o.pay==="wave"?(P.wave||c.wave):o.pay==="om"?(P.om||c.om):"";
  return [`*${c.shop} – ${oCity(o)}*`,`Bonjour ${o.client}, nous avons bien reçu votre commande *WEB-${o.ref}*.`,"",
   ...o.items.map(i=>`${i.q} x ${i.n} = ${fmt(i.q*i.p)}`),`*${t("total").toUpperCase()}: ${fmt(tot)}*`,"",
   o.mode==="liv"?`🛵 ${t("liv")}: ${o.addr||""}`:`📍 ${P.addr||oCity(o)}`,
   ...(num?[`${t(o.pay)}: ${num}`]:[])].join("\n")}
let delArm=false;

    <div class="ln"><span>${t("date")}</span><span>${dstr(o.date)}</span></div>

   <div class="panel">
    <h3>${t("changeStatus")}</h3>
    <div class="chips">${STATUSES.map(s=>`<button type="button" class="chip ${s===o.status?"on":""}" data-st="${s}">${t(s)}</button>`).join("")}</div>

  </div></div>`;
  const close=()=>{sh.innerHTML="";render()};
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};

  sh.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{o.status=b.dataset.st;save();openReceipt(o.id)});
  on("addpb",()=>{const v=num(val("addp"))||rest;const ch=Math.max(0,o.paid+v-tot);o.paid=Math.min(tot,o.paid+v);o.pay=val("addpm")||o.pay||"cash";save();openReceipt(o.id);if(ch)toast(t("changeL")+": "+fmt(ch))});
  on("wacc",()=>{const bad=stockCheck(o.items,o.pv);if(bad)return toast(bad);const P=PV(o.pv);
    stockTake(o,1);o.no=nextNo(o.pv);o.pre=pre3(P.city);o.agent=P.agent||o.agent||"";o.status="confirmee";save();toast(t("accepted"));openReceipt(o.id)});
  const wr=document.getElementById("wref");if(wr)wr.onclick=()=>{if(!canArm){canArm=true;wr.textContent=t("refuseSure");return}o.status="annulee";save();openReceipt(o.id)};
  const rc=document.getElementById("rcancel");if(rc)rc.onclick=()=>{if(!canArm){canArm=true;rc.textContent=t("cancelSure");return}stockTake(o,-1);o.status="annulee";save();openReceipt(o.id)};
  document.getElementById("rdel").onclick=e=>{if(!delArm){delArm=true;e.target.textContent=t("delSure");return}
    if(taken(o))stockTake(o,-1);
    delete C.order[o.id];save();close()};
}

let rv={n:"",b:"",p:"",q:""},arm="",catMode=true;
function stockPicker(){if(!isBoss())return "";const ps=PVS(),cur=CUR();
  return `<div class="chips" role="group" aria-label="${t("pvSel")}"><button type="button" class="chip ${catMode?"on":""}" data-catm>${t("catT")}</button>${ps.map(p=>`<button type="button" class="chip ${!catMode&&p.id===cur?"on":""}" data-pvsel="${p.id}">${esc(p.city)}</button>`).join("")}</div>`}

  <div class="stack">
   ${stockPicker()}
   ${er.length?`<div class="panel arrive"><h3>📦 ${t("arriving")}</h3>${er.map(e=>`<button type="button" class="order" data-arr="${e.id}"><div class="l1"><span class="who num">${esc(e.ref)}</span><b class="num">${e.items.reduce((a,i)=>a+i.q,0)}</b></div><div class="meta"><span>${dstr(e.date)}</span><span>${e.bags||1} ${t("sac").toLowerCase()}</span></div></button>`).join("")}</div>`:""}
   <p class="note" style="margin:0">${t("stockNote")}</p>

    <h3>${t("recvT")}</h3>
    <p class="note" style="margin:0">${t("recvNote")}</p>

    <label>${t("prodName")}<input id="r_n" list="slist" value="${esc(rv.n)}" placeholder="Ex. Vaseline cacao"></label>

     <div class="stk ${p.s<=0?"out":p.s<=5?"low":""}"><div style="min-width:0"><div class="nm">${esc(p.n)}</div>

      <label class="pn"><span>${t("prodName")}</span><input data-pe="n" data-id="${p.id}" value="${esc(p.n)}"></label>
      <label class="pb"><span>${t("barcode")}</span><input data-pe="b" data-id="${p.id}" inputmode="numeric" class="num" value="${esc(p.b||"")}"></label>
      <label class="pp"><span>${t("price")}</span><input data-pe="p" data-id="${p.id}" inputmode="numeric" value="${p.p}"></label>
      <label class="ps"><span>${t("stockQ")}</span><input data-pe="s" data-id="${p.id}" inputmode="numeric" value="${p.s}"></label>
      <button type="button" class="x" data-prm="${p.id}" aria-label="${t("del")}">×</button></div></details>

   ${rc.length?`<div class="panel"><h3>${t("lastRecv")}</h3>
    ${rc.slice(0,10).map(r=>`<div class="stk"><div><div class="nm">${esc(r.n)}</div><div class="sub">${dstr(r.d)}${r.env?" · "+esc(r.env):""}</div></div><div class="q" style="color:var(--ok)">+${r.q}</div></div>`).join("")}</div>`:""}
  </div>`;}
function newProd(n,pv,price,b){const c=findCat(n);const p={id:"p"+uid(),pv,n:c?c.n:n.trim(),b:b||(c&&c.b)||"",p:num(price)||(c?num(c.p):0),s:0};C.prod[p.id]=p;return p}
function bStock(){
  document.querySelectorAll("[data-catm]").forEach(b=>b.onclick=()=>{catMode=true;render()});
  document.querySelectorAll("[data-pvsel]").forEach(b=>b.onclick=()=>{catMode=false;setSel(b.dataset.pvsel);render()});
  if(isBoss()&&(catMode||!CUR()))return bCatalog();
  document.querySelectorAll("[data-arr]").forEach(b=>b.onclick=()=>openArrival(b.dataset.arr));
  const rf=document.getElementById("rf");if(!rf)return;const pv=CUR();
  const rd=()=>{rv={n:val("r_n"),b:val("r_b"),p:val("r_p"),q:val("r_q")}};
  rf.addEventListener("input",e=>{rd();if(e.target.id==="r_n"){const p=findP(rv.n,pv)||findCat(rv.n);if(p){document.getElementById("r_p").value=p.p;document.getElementById("r_b").value=p.b||"";rd()}}});
  rf.addEventListener("submit",e=>{e.preventDefault();rd();
    const n=rv.n.trim(),q=num(rv.q);if(!n||!q)return toast(t("recvNeed"));
    let p=findP(n,pv);
    if(!p){if(!num(rv.p)&&!findCat(n))return toast(t("newNeedPrice"));p=newProd(n,pv,rv.p,rv.b.trim())}
    else{if(num(rv.p))p.p=num(rv.p);if(rv.b.trim())p.b=rv.b.trim()}
    p.s+=q;const r={id:"r"+uid(),pv,d:new Date().toISOString(),n:p.n,q};C.recv[r.id]=r;
    rv={n:"",b:"",p:"",q:""};save();toast(t("recvOk"));render()});
  document.querySelectorAll("[data-pe]").forEach(inp=>{const p=C.prod[inp.dataset.id],f=inp.dataset.pe;if(!p)return;
    if(f==="n")inp.onchange=()=>{p.n=inp.value.trim()||p.n;save();render()};
    else if(f==="b"){inp.oninput=()=>{p.b=inp.value.trim();save()};inp.onchange=()=>{const c=inp.value.replace(/\s/g,"");if(!c)return;
      const o=prods(pv).find(x=>x.id!==p.id&&x.b&&String(x.b).replace(/\s/g,"")===c);if(o)toast(t("codeDup")+" "+o.n)}}
    else{inp.oninput=()=>{p[f]=num(inp.value);save()};inp.onchange=()=>render()}});
  document.querySelectorAll("[data-prm]").forEach(b=>b.onclick=()=>{const id=b.dataset.prm;if(arm!==id){arm=id;b.textContent="?";toast(t("delSure"));return}
    arm="";delete C.prod[id];save();render()});
}

function dayStats(day,pv){const os=ordersOf(pv).filter(o=>taken(o)&&today(new Date(o.date))===day);
  const sold=os.reduce((a,o)=>a+totalOf(o),0),cashed=os.reduce((a,o)=>a+o.paid,0);
  const by={};os.forEach(o=>o.items.forEach(i=>{by[i.n]=by[i.n]||{q:0,v:0};by[i.n].q+=i.q;by[i.n].v+=i.q*i.p}));
  const rows=Object.entries(by).sort((a,b)=>b[1].v-a[1].v);
  const recv=pv?recvOf(pv).filter(r=>today(new Date(r.d))===day):[];
  return {os,sold,cashed,rows,recv};}

   `*${t("byProd")}*`,...s.rows.map(([n,r])=>`- ${n}: ${r.q} (${fmt(r.v)})`),"",

   `*${t("orders")}*`,...s.os.slice().reverse().map(o=>`${rno(o)} ${o.client}: ${fmt(totalOf(o))}${totalOf(o)-o.paid>0?` (${t("rest")} ${fmt(totalOf(o)-o.paid)})`:""}`)].join("\n");}

function importBackup(txt,pv){if(!pv)return;let d;try{d=JSON.parse(txt);if(!d||!Array.isArray(d.orders)||!Array.isArray(d.products))throw 0}catch(e){return toast(t("badBackup"))}
  const P=PV(pv),key=s=>String(s).replace(/[^\w-]/g,"").slice(0,40);let n=0;
  d.products.filter(p=>!p.ex&&p.n).forEach(p=>{let x=findP(p.n,pv);if(!x){x={id:"p"+uid(),pv,n:p.n,b:p.b||"",p:num(p.p),s:0};C.prod[x.id]=x}
    x.p=num(p.p)||x.p;if(p.b)x.b=String(p.b);x.s=Number(p.s)||0});
  d.orders.filter(o=>!o.ex).forEach(o=>{const id="i"+key(pv)+key(o.id);if(C.order[id])return;
    C.order[id]={id,pv,no:o.no||0,pre:o.pre||pre3(P.city),city:(d.cfg&&d.cfg.city)||P.city,agent:(d.cfg&&d.cfg.agent)||P.agent||"",date:o.date,client:o.client||"",phone:o.phone||"",
      items:(o.items||[]).map(i=>({n:i.n,q:num(i.q),p:num(i.p)})),given:num(o.given??o.paid),paid:num(o.paid),change:num(o.change),status:o.status||"confirmee"};n++});
  (d.recv||[]).filter(r=>!r.ex).forEach((r,i)=>{const id="j"+key(pv)+key(r.d)+i;if(!C.recv[id])C.recv[id]={id,pv,d:r.d,n:r.n,q:num(r.q)}});
  save();toast(t("imported")+" : "+n+" "+t("orders").toLowerCase());render()}

function savePDF(doc,filename){
  if(!doc)return toast(t("pdfNA"));
  const fname=filename.replace(/[^\w.-]+/g,"-");let blob;try{blob=doc.output("blob")}catch(e){return toast(t("pdfNA"))}
  if(window.claude&&window.claude.use){(async()=>{try{const dl=await window.claude.use("downloads");if(dl)await dl.save({filename:fname,data:blob});else toast(t("pdfNA"))}catch(e){if(!e||e.code!=="declined")toast(t("pdfNA"))}})();return}
  try{const f=new File([blob],fname,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:fname}).catch(e=>{if(e&&e.name!=="AbortError")openBlob(blob,fname)});return}}catch(e){}
  openBlob(blob,fname)}
function openBlob(blob,fname){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fname;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function pdfBase(title,sub,dlabel){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=14,R=W-M;const st={doc,W,M,R,y:16};
  try{doc.addImage(LOGO,"PNG",M,st.y-6,18,18)}catch(e){}
  const X=M+22;
  doc.setFont("helvetica","bold");doc.setFontSize(17);doc.text(CFG().shop,X,st.y);
  doc.setFontSize(11);doc.text(dlabel,R,st.y,{align:"right"});st.y+=6;
  doc.setFontSize(12);doc.text(title,X,st.y);st.y+=5;
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(sub,X,st.y);st.y+=5;
  doc.setLineWidth(.6);doc.line(M,st.y,R,st.y);st.y+=8;
  st.need=h=>{if(st.y+h>282){doc.addPage();st.y=16}};
  st.boxes=box=>{const bw=(R-M-9)/4;box.forEach(([l,v],i)=>{const x=M+i*(bw+3);doc.setLineWidth(.3);doc.rect(x,st.y,bw,16);
    doc.setFontSize(7.5);doc.setFont("helvetica","normal");doc.text(l.toUpperCase(),x+2.5,st.y+5);
    doc.setFontSize(11);doc.setFont("helvetica","bold");doc.text(v,x+2.5,st.y+12)});st.y+=24};
  st.head=title=>{st.need(16);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(title,M,st.y);st.y+=5};
  st.thead=cs=>{doc.setFillColor(230,233,238);doc.rect(M,st.y,R-M,7,"F");doc.setFontSize(8.5);doc.setFont("helvetica","bold");
    let x=M;cs.forEach(c=>{doc.text(c.h,c.r?x+c.w-2:x+2,st.y+4.8,c.r?{align:"right"}:undefined);x+=c.w});st.y+=7};
  st.trow=(cs,vals,bold)=>{doc.setFontSize(8.5);doc.setFont("helvetica",bold?"bold":"normal");
    const lines=vals.map((v,i)=>doc.splitTextToSize(String(v),cs[i].w-4));const h=Math.max(...lines.map(l=>l.length))*3.8+3;
    if(st.y+h>282){doc.addPage();st.y=16;st.thead(cs);doc.setFont("helvetica",bold?"bold":"normal")}
    let x=M;lines.forEach((l,i)=>{const c=cs[i];doc.text(l,c.r?x+c.w-2:x+2,st.y+4.3,c.r?{align:"right"}:undefined);x+=c.w});
    st.y+=h;doc.setDrawColor(200);doc.setLineWidth(.2);doc.line(M,st.y,R,st.y);doc.setDrawColor(0)};
  st.foot=label=>{const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`${label} · ${i}/${n}`,W/2,291,{align:"center"});doc.setTextColor(0)}};
  return st}

  if(lows.length){const c3=[{h:t("pvSel"),w:50},{h:t("product"),w:100},{h:t("stockQ"),w:32,r:1}];st.head(t("lowAlert"));st.thead(c3);lows.forEach(l=>st.trow(c3,l))}
  st.foot(`${t("repAll")} · ${dlabel}`);return st.doc}
function receiptPDF(o){if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf,W=80,lineH=4.6,cf=CFG();
  const est=110+o.items.length*10;const doc=new jsPDF({unit:"mm",format:[W,Math.max(120,est+40)]});
  let y=0;const M=5,R=W-M,tot=totalOf(o);
  try{doc.addImage(STRIP,"JPEG",0,0,W,W*550/1320)}catch(e){}y=W*550/1320;
  doc.setFillColor(255,255,255);doc.circle(W/2,y,12,"F");
  try{doc.addImage(LOGO,"PNG",W/2-11,y-11,22,22)}catch(e){}y+=17;
  const c=(txt,size,bold)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);doc.splitTextToSize(txt,W-10).forEach(l=>{doc.text(l,W/2,y,{align:"center"});y+=size*.45})};
  const ln=(a,b,bold,size=9)=>{doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(size);const al=doc.splitTextToSize(a,R-M-30);doc.text(al,M,y);doc.text(b,R,y,{align:"right"});y+=al.length*lineH};
  const dash=()=>{doc.setLineDashPattern([1,1],0);doc.line(M,y-1.5,R,y-1.5);doc.setLineDashPattern([],0);y+=3};
  c(cf.shop,13,true);y+=1;c([oCity(o),oAgent(o)].filter(Boolean).join(" · "),8.5);if(cf.tel)c(t("tel")+" "+cf.tel,8.5);y+=2;dash();
  ln(t("receiptNo"),rno(o),true);ln(t("date"),dstr(o.date));ln(t("clientL"),o.client);if(o.phone)ln(t("tel"),o.phone);if(o.mode==="liv")ln(t("liv"),o.addr||"");else if(o.mode==="ret")ln(t("retS"),oCity(o));dash();
  o.items.forEach(i=>{ln(i.q+" x "+i.n,fmt(i.q*i.p));doc.setFontSize(7.5);doc.setTextColor(110);doc.text("@ "+fmt(i.p),M,y-1);doc.setTextColor(0);y+=2.5});
  dash();ln(t("total").toUpperCase(),fmt(tot),true,11);y+=1;if(o.change){ln(t("givenR"),fmt(o.given));ln(t("changeR"),fmt(o.change))}ln(t("paid"),fmt(o.paid));ln(t("rest"),fmt(Math.max(0,tot-o.paid)),true);ln(t("status"),t(o.status));
  dash();c(t("thanks"),9);
  return doc}

function envPDF(e){if(!window.jspdf)return null;
  const P=PV(e.pv),dl=new Date(e.date).toLocaleDateString("fr-FR"),got=e.got||[],rec=e.status==="recv";
  const st=pdfBase(t("bord")+"  ·  "+e.ref,`${t("envTo")}: ${P.city}  ·  ${t("agent")}: ${P.agent||""}`,dl),doc=st.doc,M=st.M,R=st.R;
  st.boxes([[t("envOf"),e.ref],[t("envTo"),P.city||""],[t("bags"),String(e.bags||1)],[t("qty"),String(e.items.reduce((a,i)=>a+i.q,0))]]);
  const cols=[{h:"N°",w:12},{h:t("product"),w:104},{h:t("envSent"),w:30,r:1},{h:t("checkCol"),w:36,r:1}];
  st.head(t("products"));st.thead(cols);
  e.items.forEach((i,k)=>st.trow(cols,[k+1,i.n,i.q,rec?num(got[k]):"______"]));
  st.trow(cols,["",t("total").toUpperCase(),e.items.reduce((a,i)=>a+i.q,0),rec?got.reduce((a,g)=>a+num(g),0):""],true);st.y+=6;
  if(e.note){st.need(12);doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(doc.splitTextToSize(t("noteL")+": "+e.note,R-M),M,st.y);st.y+=10}
  st.need(30);doc.setFont("helvetica","normal");doc.setFontSize(9);st.y+=4;
  doc.line(M,st.y+12,M+70,st.y+12);doc.text(t("dakar"),M,st.y+17);doc.line(R-70,st.y+12,R,st.y+12);doc.text(t("signAgent")+" – "+(P.city||""),R-70,st.y+17);
  st.foot(`${e.ref} · ${P.city} · ${dl}`);return doc}
function labelsPDF(e){if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),P=PV(e.pv),n=Math.max(1,e.bags||1),dl=new Date(e.date).toLocaleDateString("fr-FR");
  const W=95,H=136,pos=[[10,10],[105,10],[10,151],[105,151]];
  for(let i=0;i<n;i++){if(i&&i%4===0)doc.addPage();const [x,y]=pos[i%4];
    doc.setLineWidth(.8);doc.setLineDashPattern([2,1.5],0);doc.rect(x,y,W,H);doc.setLineDashPattern([],0);
    try{doc.addImage(LOGO,"PNG",x+W/2-12,y+6,24,24)}catch(err){}
    doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(CFG().shop,x+W/2,y+38,{align:"center"});
    doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(t("envTo").toUpperCase(),x+W/2,y+50,{align:"center"});
    doc.setFont("helvetica","bold");doc.setFontSize(30);doc.text(doc.splitTextToSize(String(P.city||"").toUpperCase(),W-10),x+W/2,y+64,{align:"center"});
    doc.setFontSize(12);doc.text(P.agent||"",x+W/2,y+73,{align:"center"});
    doc.setFillColor(42,26,15);doc.rect(x+12,y+80,W-24,22,"F");doc.setTextColor(255);doc.setFontSize(22);doc.text(`${t("sac")} ${i+1} / ${n}`,x+W/2,y+95,{align:"center"});doc.setTextColor(0);
    doc.setFontSize(14);doc.text(e.ref,x+W/2,y+114,{align:"center"});
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(dl+"  ·  "+e.items.reduce((a,it)=>a+it.q,0)+" "+t("products").toLowerCase(),x+W/2,y+122,{align:"center"});
    doc.text(t("envPdf").replace(/\s*\(PDF\)/,""),x+W/2,y+128,{align:"center"})}
  return doc}

/* documents pour les clients et PDF : toujours en français */
const FR=f=>function(...a){const l=LANG;LANG="fr";try{return f.apply(this,a)}finally{LANG=l}};
receiptText=FR(receiptText);webReplyText=FR(webReplyText);reportText=FR(reportText);generalText=FR(generalText);envWaText=FR(envWaText);
reportPDF=FR(reportPDF);generalPDF=FR(generalPDF);receiptPDF=FR(receiptPDF);envPDF=FR(envPDF);labelsPDF=FR(labelsPDF);
/* ---------- démarrage ---------- */
const setLang=l=>{if(view==="new")readDraft();LANG=l;try{localStorage.setItem(K_LANG,l)}catch(e){}render()};
document.getElementById("lfr").onclick=()=>setLang("fr");
document.getElementById("lit").onclick=()=>setLang("wo");
loadLocal();render();
if(SES){setSync("wait");sync()}

</script>
